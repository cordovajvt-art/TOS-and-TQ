services:
  web:
    build:
      context: .
    image: examflow-prototype:local
    init: true
    restart: unless-stopped
    environment:
      PORT: 4173
    ports:
      - "${EXAMFLOW_PORT:-4173}:4173"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
