services:
  - type: web
    name: examflow-tos-tq
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.mjs
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
